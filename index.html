<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freshy Badminton 2026 - Scoreboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, child, update, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        // Expose to global scope for vanilla JS to use
        window.firebaseModules = { initializeApp, getDatabase, ref, onValue, set, get, child, update, runTransaction, serverTimestamp };
    </script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f8fafc; /* slate-50 */
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-modal { animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Remove arrows from number inputs */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Main Application Container -->
    <div id="app" class="h-full flex flex-col w-full max-w-5xl mx-auto bg-white shadow-2xl relative">
        <!-- Content will be rendered here -->
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURATION & CONSTANTS
        // ==========================================
        
        // URL ของ Google Apps Script Web App (ลงท้ายด้วย /exec)
        // ถ้ายังว่าง ระบบจะใช้ข้อมูลจำลองในเครื่องเหมือนเดิม
        const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycby34yk1zgkswsSLL1iHgxGjbuboeaaTUw2MTgIOaIG5T8odNxTB7xGQqnJKXcgtljF4/exec";
        const SHEETS_API_KEY = "";

        // ⚠️ โหมดเก่า Firebase: ใช้เป็น fallback เท่านั้น
        // ถ้าค่าเป็น "YOUR_..." ระบบจะทำงานใน "โหมดสาธิต (Demo Mode)" อัตโนมัติ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const JUDGE_PIN = "1234"; // PIN สำหรับกรรมการ
        const IS_SHEETS_MODE = Boolean(SHEETS_API_URL);
        const IS_DEMO_MODE = !IS_SHEETS_MODE && (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("YOUR_"));

        const DEPARTMENTS = [
            { id: 'd1', name: 'สาขาการแพทย์แผนไทย', shortName: 'แพทย์แผนไทย', color: 'bg-emerald-500' },
            { id: 'd2', name: 'สาขารังสีเทคนิค', shortName: 'รังสีเทคนิค', color: 'bg-blue-500' },
            { id: 'd3', name: 'สาขา วท.บ.เวชระเบียน + ปวส.เวชระเบียน', shortName: 'เวชระเบียน', color: 'bg-purple-500' },
            { id: 'd4', name: 'สาขานวัตกรรมสื่อสาร + ฉุกเฉินการแพทย์', shortName: 'นวัตกรรม+ฉุกเฉิน', color: 'bg-rose-500' }
        ];

        const EVENT_TYPES = {
            'MD': 'ชายคู่',
            'WD': 'หญิงคู่',
            'XD': 'คู่ผสม'
        };

        const STATUSES = {
            'scheduled': { id: 'scheduled', label: 'รอแข่ง', badgeClass: 'bg-slate-100 text-slate-600 border border-slate-200' },
            'live': { id: 'live', label: 'กำลังแข่ง', badgeClass: 'bg-blue-100 text-blue-700 border border-blue-200 animate-pulse' },
            'finished': { id: 'finished', label: 'จบแล้ว', badgeClass: 'bg-green-100 text-green-700 border border-green-200' },
            'walkover': { id: 'walkover', label: 'สละสิทธิ์', badgeClass: 'bg-orange-100 text-orange-700 border border-orange-200' },
            'needs_review': { id: 'needs_review', label: 'รอตรวจสอบ', badgeClass: 'bg-red-100 text-red-700 border border-red-200' }
        };

        // ==========================================
        // 2. STATE MANAGEMENT
        // ==========================================
        let state = {
            matches: [],
            isLoading: true,
            currentTab: 'dashboard', // dashboard, schedule, setup
            isJudge: false,
            judgeName: '',
            filterEvent: 'all',
            filterStatus: 'all',
            toast: null,
            modals: {
                judgeLogin: false,
                scoreEntry: null // match ID
            },
            editingMatch: null, // Temporary match data during edit
            isSaving: false
        };

        let broadcastChannel = null;
        let dbRef = null;

        // ==========================================
        // 3. CORE LOGIC & SCORING RULES
        // ==========================================
        
        function getDept(id) { return DEPARTMENTS.find(d => d.id === id) || DEPARTMENTS[0]; }

        function calculateMatchResult(match) {
            // คำนวณคะแนนรวมดิบ
            match.totalA = match.sets.set1.scoreA + match.sets.set2.scoreA;
            match.totalB = match.sets.set1.scoreB + match.sets.set2.scoreB;

            // คำนวณจำนวนเซตที่ชนะ
            match.setWinsA = (match.sets.set1.scoreA > match.sets.set1.scoreB ? 1 : 0) + 
                             (match.sets.set2.scoreA > match.sets.set2.scoreB ? 1 : 0);
            match.setWinsB = (match.sets.set1.scoreB > match.sets.set1.scoreA ? 1 : 0) + 
                             (match.sets.set2.scoreB > match.sets.set2.scoreA ? 1 : 0);

            // ตัดสินผู้ชนะ (เฉพาะเมื่อสถานะเป็น จบแล้ว หรือ รอตรวจสอบ)
            if (match.status === 'finished' || match.status === 'needs_review') {
                if (match.totalA > match.totalB) {
                    match.winner = 'A';
                    match.status = 'finished';
                } else if (match.totalB > match.totalA) {
                    match.winner = 'B';
                    match.status = 'finished';
                } else {
                    // คะแนนรวมเท่ากัน ต้องรอกรรมการยืนยัน
                    if (match.status !== 'needs_review' || !match.winner) {
                        match.winner = 'TIE_PENDING';
                        match.status = 'needs_review';
                    }
                }
            } else if (match.status !== 'walkover') {
                match.winner = null; // scheduled หรือ live
            }
            
            return match;
        }

        function validateCompletedMatch(match) {
            if (match.status === 'walkover' || match.status === 'scheduled' || match.status === 'live') {
                return { valid: true };
            }

            const checkSet = (score1, score2) => {
                // กติกา: ต้องมีคนได้ 21 และอีกคนต้องอยู่ระหว่าง 0-20 (ไม่มีดิวซ์)
                if ((score1 === 21 && score2 >= 0 && score2 <= 20) || 
                    (score2 === 21 && score1 >= 0 && score1 <= 20)) {
                    return true;
                }
                return false;
            };

            const s1Valid = checkSet(match.sets.set1.scoreA, match.sets.set1.scoreB);
            const s2Valid = checkSet(match.sets.set2.scoreA, match.sets.set2.scoreB);

            if (!s1Valid || !s2Valid) {
                return { 
                    valid: false, 
                    msg: "คะแนนไม่ถูกต้อง: ตามกติกาแต่ละเซตต้องมีผู้ชนะ 21 แต้ม และฝ่ายแพ้ไม่เกิน 20 แต้ม (ไม่มีดิวซ์)" 
                };
            }
            return { valid: true };
        }

        function calculateDepartmentRanking() {
            let stats = {};
            DEPARTMENTS.forEach(d => {
                stats[d.id] = { ...d, totalRaw: 0, matchPlayed: 0, matchWins: 0, setDiff: 0, ptDiff: 0, setWins: 0, setLoss: 0, ptWon:0, ptLoss:0 };
            });

            state.matches.forEach(m => {
                // กรองตามประเภทกีฬาหากมีการเลือก
                if (state.filterEvent !== 'all' && m.eventType !== state.filterEvent) return;
                
                if (m.status === 'finished' || m.status === 'walkover') {
                    const idA = m.teamA.departmentId;
                    const idB = m.teamB.departmentId;

                    stats[idA].matchPlayed++;
                    stats[idB].matchPlayed++;

                    // การคำนวณกรณีปกติ
                    if (m.status === 'finished') {
                        stats[idA].totalRaw += m.totalA;
                        stats[idB].totalRaw += m.totalB;

                        stats[idA].ptWon += m.totalA; stats[idA].ptLoss += m.totalB;
                        stats[idB].ptWon += m.totalB; stats[idB].ptLoss += m.totalA;

                        stats[idA].setWins += m.setWinsA; stats[idA].setLoss += m.setWinsB;
                        stats[idB].setWins += m.setWinsB; stats[idB].setLoss += m.setWinsA;
                    }

                    // ชนะแมตช์ (รวม Walkover)
                    if (m.winner === 'A') stats[idA].matchWins++;
                    else if (m.winner === 'B') stats[idB].matchWins++;

                    // สรุปผลต่าง
                    stats[idA].setDiff = stats[idA].setWins - stats[idA].setLoss;
                    stats[idB].setDiff = stats[idB].setWins - stats[idB].setLoss;
                    stats[idA].ptDiff = stats[idA].ptWon - stats[idA].ptLoss;
                    stats[idB].ptDiff = stats[idB].ptWon - stats[idB].ptLoss;
                }
            });

            // เรียงลำดับ: Total Raw > Match Wins > Set Diff > Point Diff > ชื่อ
            return Object.values(stats).sort((a, b) => {
                if (b.totalRaw !== a.totalRaw) return b.totalRaw - a.totalRaw;
                if (b.matchWins !== a.matchWins) return b.matchWins - a.matchWins;
                if (b.setDiff !== a.setDiff) return b.setDiff - a.setDiff;
                if (b.ptDiff !== a.ptDiff) return b.ptDiff - a.ptDiff;
                return a.name.localeCompare(b.name);
            });
        }

        // ==========================================
        // 4. DATA SYNCHRONIZATION
        // ==========================================

        function generateSeedData() {
            const types = Object.keys(EVENT_TYPES);
            const data = [];
            let idCounter = 1;
            
            // สร้างข้อมูลจำลอง วันที่ 19 ส.ค. 2026 ตั้งแต่ 17:00 - 21:00
            for (let hour = 17; hour <= 20; hour++) {
                for(let court = 1; court <= 2; court++) {
                    const type = types[(idCounter-1) % 3];
                    const d1 = DEPARTMENTS[idCounter % 4];
                    const d2 = DEPARTMENTS[(idCounter+1) % 4];
                    
                    let status = hour < 19 ? 'finished' : (hour === 19 ? 'live' : 'scheduled');
                    let s1A = 0, s1B = 0, s2A = 0, s2B = 0;

                    if (status === 'finished') {
                        s1A = 21; s1B = 15;
                        s2A = 18; s2B = 21;
                    } else if (status === 'live') {
                        s1A = 21; s1B = 18;
                        s2A = 10; s2B = 5;
                    }
                    
                    data.push({
                        id: `m${idCounter}`,
                        dateISO: '2026-08-19',
                        scheduledTime: `${hour}:00`,
                        court: `สนาม ${court}`,
                        eventType: type,
                        teamA: { id: `tA${idCounter}`, name: `ทีม ${d1.shortName}`, departmentId: d1.id },
                        teamB: { id: `tB${idCounter}`, name: `ทีม ${d2.shortName}`, departmentId: d2.id },
                        status: status,
                        sets: {
                            set1: { scoreA: s1A, scoreB: s1B },
                            set2: { scoreA: s2A, scoreB: s2B }
                        },
                        totalA: 0, totalB: 0, setWinsA: 0, setWinsB: 0, winner: null,
                        updatedAt: Date.now(),
                        updatedBy: 'System',
                        version: 1,
                        auditLog: []
                    });
                    idCounter++;
                }
            }
            return data.map(calculateMatchResult);
        }

        function initApp() {
            // Restore session
            const savedJudge = localStorage.getItem('judgeName');
            if (savedJudge) {
                state.isJudge = true;
                state.judgeName = savedJudge;
            }

            if (IS_SHEETS_MODE) {
                console.log("🔵 Connecting to Google Sheets");
                loadFromSheets();
            } else if (IS_DEMO_MODE) {
                console.log("🟢 Running in Demo Mode (Local Storage + BroadcastChannel)");
                // Setup Broadcast Channel for cross-tab sync in Demo Mode
                if ('BroadcastChannel' in window) {
                    broadcastChannel = new BroadcastChannel('badminton_sync_channel');
                    broadcastChannel.onmessage = (e) => {
                        if (e.data && e.data.type === 'SYNC_DATA') {
                            state.matches = e.data.payload;
                            render();
                        }
                    };
                }

                const localData = localStorage.getItem('badminton_matches');
                if (localData) {
                    state.matches = JSON.parse(localData);
                } else {
                    state.matches = generateSeedData();
                    localStorage.setItem('badminton_matches', JSON.stringify(state.matches));
                }
                state.isLoading = false;
                render();
            } else {
                console.log("🔵 Attempting to connect to Firebase Realtime Database");
                // Wait for Firebase modules to load via CDN
                const checkInterval = setInterval(() => {
                    if (window.firebaseModules && window.firebaseModules.initializeApp) {
                        clearInterval(checkInterval);
                        setupFirebase();
                    }
                }, 100);
            }
        }

        async function loadFromSheets() {
            try {
                const response = await fetch(`${SHEETS_API_URL}?action=list&key=${encodeURIComponent(SHEETS_API_KEY)}`);
                const result = await response.json();
                if (!result.ok) throw new Error(result.error || 'โหลดข้อมูลไม่สำเร็จ');
                state.matches = result.matches || [];
                state.isLoading = false;
                render();
            } catch (error) {
                console.error(error);
                showToast('เชื่อมต่อ Google Sheets ไม่สำเร็จ จึงใช้ข้อมูลจำลองชั่วคราว', true);
                state.matches = generateSeedData();
                state.isLoading = false;
                render();
            }
        }

        function setupFirebase() {
            try {
                const app = window.firebaseModules.initializeApp(firebaseConfig);
                const db = window.firebaseModules.getDatabase(app);
                const matchesRef = window.firebaseModules.ref(db, 'matches');
                
                // Realtime Listener
                window.firebaseModules.onValue(matchesRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        state.matches = Object.values(data);
                    } else {
                        // Seed database if empty
                        const seedData = generateSeedData();
                        const dataObj = {};
                        seedData.forEach(m => dataObj[m.id] = m);
                        window.firebaseModules.set(matchesRef, dataObj);
                    }
                    state.isLoading = false;
                    render();
                });
            } catch (error) {
                console.error("Firebase setup failed:", error);
                showToast("การเชื่อมต่อฐานข้อมูลล้มเหลว กลับสู่โหมดสาธิต", true);
            }
        }

        async function updateMatchData(updatedMatch, auditNote = '') {
            state.isSaving = true;
            render();

            // Prepare audit log
            const logEntry = {
                timestamp: Date.now(),
                judgeName: state.judgeName,
                action: `Updated status to ${updatedMatch.status}`,
                note: auditNote || ''
            };
            if (!updatedMatch.auditLog) updatedMatch.auditLog = [];
            updatedMatch.auditLog.unshift(logEntry); // Add to beginning
            
            // Keep only last 10 logs
            if (updatedMatch.auditLog.length > 10) updatedMatch.auditLog.pop();

            updatedMatch.updatedAt = Date.now();
            updatedMatch.updatedBy = state.judgeName;
            
            if (IS_SHEETS_MODE) {
                try {
                    const response = await fetch(SHEETS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'save', key: SHEETS_API_KEY, match: updatedMatch })
                    });
                    const result = await response.json();
                    if (!result.ok) throw new Error(result.error || 'บันทึกไม่สำเร็จ');
                    const index = state.matches.findIndex(m => m.id === updatedMatch.id);
                    if (index >= 0) state.matches[index] = result.match || updatedMatch;
                    showToast('บันทึกผลลง Google Sheets สำเร็จ!');
                } catch (err) {
                    console.error(err);
                    showToast('บันทึกลง Google Sheets ไม่สำเร็จ', true);
                }
            } else if (IS_DEMO_MODE) {
                // Simulate Concurrency Check in Demo Mode
                const index = state.matches.findIndex(m => m.id === updatedMatch.id);
                if (index !== -1) {
                    const currentVersion = state.matches[index].version || 1;
                    if (updatedMatch.version !== currentVersion) {
                        showToast("เกิดข้อผิดพลาด: ข้อมูลถูกอัปเดตโดยกรรมการคนอื่น กรุณาตรวจสอบอีกครั้ง", true);
                        state.isSaving = false;
                        render();
                        return;
                    }
                    updatedMatch.version = currentVersion + 1;
                    state.matches[index] = updatedMatch;
                    localStorage.setItem('badminton_matches', JSON.stringify(state.matches));
                    if (broadcastChannel) broadcastChannel.postMessage({ type: 'SYNC_DATA', payload: state.matches });
                    showToast("บันทึกผลสำเร็จ!");
                }
            } else {
                // Firebase Transaction for concurrency control
                try {
                    const db = window.firebaseModules.getDatabase();
                    const matchRef = window.firebaseModules.ref(db, `matches/${updatedMatch.id}`);
                    
                    const result = await window.firebaseModules.runTransaction(matchRef, (currentData) => {
                        if (currentData === null) return updatedMatch; // Not exists yet
                        if (currentData.version !== updatedMatch.version) {
                            return; // Abort transaction if version mismatch
                        }
                        updatedMatch.version = currentData.version + 1;
                        updatedMatch.updatedAt = window.firebaseModules.serverTimestamp(); // Use server time
                        return updatedMatch;
                    });

                    if (result.committed) {
                        showToast("บันทึกผลสำเร็จผ่านเซิร์ฟเวอร์!");
                    } else {
                        showToast("ข้อมูลถูกอัปเดตโดยกรรมการคนอื่น กรุณาตรวจสอบข้อมูลล่าสุด", true);
                    }
                } catch (err) {
                    showToast("เกิดข้อผิดพลาดในการบันทึก", true);
                    console.error(err);
                }
            }

            state.isSaving = false;
            closeModals();
        }

        // ==========================================
        // 5. EVENT DELEGATION
        // ==========================================

        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            
            const action = target.getAttribute('data-action');
            const payload = target.getAttribute('data-payload');

            switch (action) {
                case 'switch-tab':
                    state.currentTab = payload;
                    render();
                    break;
                case 'filter-event':
                    state.filterEvent = payload;
                    render();
                    break;
                case 'open-login':
                    state.modals.judgeLogin = true;
                    render();
                    break;
                case 'logout':
                    state.isJudge = false;
                    state.judgeName = '';
                    localStorage.removeItem('judgeName');
                    showToast("ออกจากระบบแล้ว");
                    render();
                    break;
                case 'close-modals':
                    closeModals();
                    break;
                case 'open-score-modal':
                    if (!state.isJudge) {
                        showToast("กรุณาเข้าสู่ระบบกรรมการก่อน", true);
                        return;
                    }
                    const matchToEdit = state.matches.find(m => m.id === payload);
                    if (matchToEdit) {
                        state.modals.scoreEntry = payload;
                        // Deep copy for temporary editing
                        state.editingMatch = JSON.parse(JSON.stringify(matchToEdit));
                        render();
                    }
                    break;
                case 'save-score':
                    handleSaveScore();
                    break;
                case 'reset-demo':
                    if (confirm("ยืนยันการล้างข้อมูลทั้งหมด? (ข้อมูลจะกลับเป็นค่าเริ่มต้น)")) {
                        state.matches = generateSeedData();
                        localStorage.setItem('badminton_matches', JSON.stringify(state.matches));
                        if (broadcastChannel) broadcastChannel.postMessage({ type: 'SYNC_DATA', payload: state.matches });
                        showToast("รีเซ็ตข้อมูลเรียบร้อยแล้ว");
                        render();
                    }
                    break;
            }
        });

        // Handle dynamic inputs in Score Modal
        document.addEventListener('input', (e) => {
            if (!state.editingMatch) return;
            
            const id = e.target.id;
            const val = e.target.value;

            if (id === 'edit-status') {
                state.editingMatch.status = val;
                render(); // Re-render to show/hide fields (e.g. walkover winner select)
            }
        });

        function closeModals() {
            state.modals.judgeLogin = false;
            state.modals.scoreEntry = null;
            state.editingMatch = null;
            render();
        }

        function handleJudgeLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const pin = document.getElementById('login-pin').value.trim();

            if (name && pin === JUDGE_PIN) {
                state.isJudge = true;
                state.judgeName = name;
                localStorage.setItem('judgeName', name);
                showToast(`เข้าสู่ระบบสำเร็จ: ${name}`);
                closeModals();
            } else {
                showToast("PIN ไม่ถูกต้อง", true);
            }
        }

        function handleSaveScore() {
            if (state.isSaving) return;
            
            const m = state.editingMatch;
            
            // 1. Gather scores from DOM
            m.sets.set1.scoreA = parseInt(document.getElementById('s1a').value) || 0;
            m.sets.set1.scoreB = parseInt(document.getElementById('s1b').value) || 0;
            m.sets.set2.scoreA = parseInt(document.getElementById('s2a').value) || 0;
            m.sets.set2.scoreB = parseInt(document.getElementById('s2b').value) || 0;
            
            // 2. Walkover / Tie Handling
            const auditNoteInput = document.getElementById('audit-note');
            let auditNote = auditNoteInput ? auditNoteInput.value : '';

            if (m.status === 'walkover') {
                m.winner = document.getElementById('walkover-winner').value;
            } else if (m.status === 'needs_review') {
                const tieWinner = document.getElementById('tie-winner');
                if (tieWinner && tieWinner.value !== 'TIE_PENDING') {
                    m.winner = tieWinner.value;
                    m.status = 'finished'; // Resolve tie manually
                    if (!auditNote) auditNote = "กรรมการยืนยันผู้ชนะจากผลเสมอ";
                }
            }

            // 3. Recalculate Logic
            calculateMatchResult(m);

            // 4. Validate
            const validation = validateCompletedMatch(m);
            if (!validation.valid) {
                showToast(validation.msg, true);
                return;
            }

            // 5. Save
            updateMatchData(m, auditNote);
        }

            state.toast = { msg, isError };

            }

            // Score Entry Modal
            if (state.modals.scoreEntry && state.editingMatch) {
                const m = state.editingMatch;
                const dA = getDept(m.teamA.departmentId);
                const dB = getDept(m.teamB.departmentId);
                const isWalkover = m.status === 'walkover';
                const isReview = m.status === 'needs_review';

                html += `
                    <div class="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-4 glass animate-fade-in">
                        <div class="absolute inset-0 bg-slate-900/50" data-action="close-modals"></div>
                        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg relative z-10 flex flex-col max-h-[90vh] animate-modal">
                            
                            <!-- Header -->
                            <div class="bg-slate-800 px-4 py-3 sm:px-5 sm:py-4 flex justify-between items-center text-white shrink-0 rounded-t-2xl">
                                <div>
                                    <h3 class="font-bold text-base md:text-lg flex items-center gap-2">
                                        <i data-lucide="pen-line" class="w-5 h-5 text-indigo-400"></i> บันทึกผลคะแนน
                                    </h3>
                                    <p class="text-xs text-slate-300 mt-0.5">${EVENT_TYPES[m.eventType]} | ${m.court}</p>
                                </div>
                                <button data-action="close-modals" class="text-slate-400 hover:text-white p-1 bg-white/10 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>

                            <!-- Body -->
                            <div class="p-4 sm:p-5 overflow-y-auto hide-scrollbar flex-1 space-y-5">
                                
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">สถานะการแข่งขัน</label>
                                    <select id="edit-status" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800 outline-none appearance-none shadow-sm cursor-pointer">
                                        ${Object.values(STATUSES).map(s => `<option value="${s.id}" ${m.status === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}
                                    </select>
                                </div>

                                <!-- Score Inputs -->
                                <div class="space-y-3 ${isWalkover ? 'opacity-40 pointer-events-none grayscale' : ''} transition-all">
                                    <div class="flex items-center justify-between text-xs font-bold text-slate-400 px-2 uppercase tracking-wider">
                                        <div class="w-1/3">ทีม</div>
                                        <div class="w-1/3 text-center">เซต 1 (21)</div>
                                        <div class="w-1/3 text-center">เซต 2 (21)</div>
                                    </div>
                                    
                                    <!-- Team A -->
                                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div class="w-1/3 pr-2 border-l-4 ${dA.color} pl-2 rounded-sm">
                                            <p class="font-bold text-slate-800 text-sm leading-tight line-clamp-2">${dA.shortName}</p>
                                        </div>
                                        <div class="w-1/3 px-1.5">
                                            <input type="number" id="s1a" value="${m.sets.set1.scoreA}" min="0" max="21" class="w-full text-center text-xl sm:text-2xl font-black text-slate-800 py-2 sm:py-3 border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-shadow block bg-white">
                                        </div>
                                        <div class="w-1/3 px-1.5">
                                            <input type="number" id="s2a" value="${m.sets.set2.scoreA}" min="0" max="21" class="w-full text-center text-xl sm:text-2xl font-black text-slate-800 py-2 sm:py-3 border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-shadow block bg-white">
                                        </div>
                                    </div>

                                    <!-- Team B -->
                                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div class="w-1/3 pr-2 border-l-4 ${dB.color} pl-2 rounded-sm">
                                            <p class="font-bold text-slate-800 text-sm leading-tight line-clamp-2">${dB.shortName}</p>
                                        </div>
                                        <div class="w-1/3 px-1.5">
                                            <input type="number" id="s1b" value="${m.sets.set1.scoreB}" min="0" max="21" class="w-full text-center text-xl sm:text-2xl font-black text-slate-800 py-2 sm:py-3 border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-shadow block bg-white">
                                        </div>
                                        <div class="w-1/3 px-1.5">
                                            <input type="number" id="s2b" value="${m.sets.set2.scoreB}" min="0" max="21" class="w-full text-center text-xl sm:text-2xl font-black text-slate-800 py-2 sm:py-3 border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-shadow block bg-white">
                                        </div>
                                    </div>
                                </div>

                                <!-- Walkover Config -->
                                ${isWalkover ? `
                                    <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl animate-fade-in">
                                        <label class="block text-sm font-bold text-orange-800 mb-2">เลือกว่าใครเป็นผู้ชนะจากการสละสิทธิ์</label>
                                        <select id="walkover-winner" class="w-full px-4 py-2.5 bg-white border border-orange-300 rounded-lg text-sm font-medium outline-none">
                                            <option value="A" ${m.winner === 'A' ? 'selected' : ''}>${dA.shortName} (ชนะ)</option>
                                            <option value="B" ${m.winner === 'B' ? 'selected' : ''}>${dB.shortName} (ชนะ)</option>
                                        </select>
                                    </div>
                                ` : ''}

                                <!-- Tie Breaker Config -->
                                ${isReview ? `
                                    <div class="bg-red-50 border border-red-200 p-4 rounded-xl animate-fade-in">
                                        <label class="block text-sm font-bold text-red-800 mb-2">ยืนยันผู้ชนะ (กรณีคะแนนดิบรวมเสมอ)</label>
                                        <select id="tie-winner" class="w-full px-4 py-2.5 bg-white border border-red-300 rounded-lg text-sm font-medium outline-none mb-3">
                                            <option value="TIE_PENDING">-- ยังไม่ตัดสิน --</option>
                                            <option value="A">${dA.shortName} (ชนะจากการตัดสิน)</option>
                                            <option value="B">${dB.shortName} (ชนะจากการตัดสิน)</option>
                                        </select>
                                        <input type="text" id="audit-note" placeholder="เหตุผลการตัดสิน (บันทึกลง Audit Log)" class="w-full px-3 py-2 text-sm border border-red-200 rounded-lg outline-none">
                                    </div>
                                ` : ''}

                                <div class="bg-indigo-50/50 text-indigo-700 text-xs p-3 rounded-lg border border-indigo-100 flex items-start gap-2">
                                    <i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5 text-indigo-500"></i>
                                    <span>กติกา: แข่ง 2 เซต เซตละ 21 แต้ม <strong>ไม่มีดิวซ์</strong> ผู้ชนะแมตช์นับจากคะแนนดิบรวม (คลิก "จบแล้ว" เพื่อตรวจสอบความถูกต้อง)</span>
                                </div>
                            </div>

                            <!-- Footer -->
                            <div class="p-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl flex gap-3 shrink-0">
                                <button data-action="close-modals" class="flex-1 py-3.5 bg-white border border-slate-300 text-slate-700 font-bold rounded-xl hover:bg-slate-100 transition-colors">
                                    ยกเลิก
                                </button>
                                <button data-action="save-score" class="flex-1 py-3.5 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition-colors shadow-lg shadow-slate-300 flex justify-center items-center gap-2 ${state.isSaving ? 'opacity-70 cursor-not-allowed' : ''}">
                                    ${state.isSaving ? '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> กำลังบันทึก...' : '<i data-lucide="save" class="w-5 h-5"></i> บันทึกข้อมูล'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function renderToast() {
            if (!state.toast) return '';
            const bg = state.toast.isError ? 'bg-red-600' : 'bg-slate-800';
            const icon = state.toast.isError ? 'alert-octagon' : 'check-circle';
            return `
                <div class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[70] animate-toast w-max max-w-[90vw]">
                    <div class="${bg} text-white px-5 py-3.5 rounded-2xl shadow-xl font-medium text-sm flex items-center gap-3">
                        <i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i> 
                        <span class="leading-tight">${state.toast.msg}</span>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 7. BOOTSTRAP
        // ==========================================
        window.onload = () => {
            initApp();
        };

    </script>
</body>
</html>
